<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLARIS BAY — an original open-world crime saga</title>
<meta name="description" content="SOLARIS BAY: an original sun-soaked coastal open world built in pure WebGL2. Drive, steal, fight and outrun a five-star police response across seven districts.">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b111b'/%3E%3Ccircle cx='16' cy='13' r='7' fill='%23ffb25a'/%3E%3Cpath d='M2 24h28v3H2z' fill='%2338c6c0'/%3E%3C/svg%3E">
</head>
<body>
<!-- The live game: one WebGL2 canvas and the HUD layer. js/hud.js builds the HUD inside #hud
(SBPD response table, mission card, wanted pill, weapon rail, crew ability cards, standing,
vitals, minimap, speedometer, dialogue); js/screens.js inserts the title screen with its
save cards, the city menu, settings, pause, load and story screens. -->
<canvas id="game" role="img" aria-label="SOLARIS BAY, a sunlit coastal city rendered in 3D: boulevards, beach, neon towers, palm trees and the ocean"></canvas>
<div id="damageFlash" aria-hidden="true"></div>
<div id="speedLines" aria-hidden="true"></div>

<div id="hud" class="hidden" aria-live="off"></div>

<div id="loading" class="loading">
<div class="loading-sun"></div>
<span>BUILDING SOLARIS BAY</span>
<div class="loading-bar"><i></i></div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
